<main>
  <section class="wrap contact-hero">
    <h1 class="page-title">CONTACT</h1>
    <form class="form" id="cform" novalidate>
      <div class="field"><label for="company" data-i18n="c_company">Company Name</label><input id="company" name="company" type="text" data-i18n-ph="c_company_ph" placeholder="회사명 (선택)"></div>
      <div class="field"><label for="name" data-i18n="c_name">Name</label><input id="name" name="name" type="text" data-i18n-ph="c_name_ph" placeholder="이름" required></div>
      <div class="field"><label for="email" data-i18n="c_email">E-mail</label><input id="email" name="email" type="email" data-i18n-ph="c_email_ph" placeholder="you@example.com" required></div>
      <div class="field"><label for="tel" data-i18n="c_tel">Tel</label><input id="tel" name="tel" type="tel" data-i18n-ph="c_tel_ph" placeholder="연락처 (선택)"></div>
      <div class="field"><label for="comment" data-i18n="c_comment">Comment</label><textarea id="comment" name="comment" data-i18n-ph="c_comment_ph" placeholder="문의 내용을 적어주세요." required></textarea></div>
      <button type="submit" class="submit"><span data-i18n="c_submit">Submit</span> &#8599;</button>
      <div class="form-note" id="formMsg"></div>
    </form>
  </section>
</main>
